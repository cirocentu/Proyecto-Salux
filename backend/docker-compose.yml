services:
  postgres-db:
    image: postgres:16-alpine
    container_name: salux_db_container
    restart: always
    # Un proceso dentro del contenedor no puede ganar privilegios nuevos (setuid, etc.).
    security_opt:
      - no-new-privileges:true
    environment:
      # Superusuario: solo para administrar el servidor (la app NO lo usa).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salux_db
      # Los lee el script docker/postgres-init/01-crear-rol-app.sh, que en una
      # instalación nueva crea el rol de la app (dueño de salux_db y nada más).
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Solo accesible desde esta máquina (Prisma Studio, un cliente SQL):
      # publicar 5432 en 0.0.0.0 deja la base abierta a toda la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Healthcheck para que el backend no arranque antes de que la base esté lista
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salux_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Contadores de los límites de intentos (login, registro, etc.): compartidos
  # entre instancias y que sobreviven a un reinicio. Solo accesible dentro de
  # la red de docker-compose (no se publica ningún puerto).
  redis:
    image: redis:7-alpine
    container_name: salux_redis_container
    restart: always
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: .
    container_name: salux_backend_container
    restart: always
    # Proceso 1 correcto: reenvía señales y recoge procesos zombi.
    init: true
    # MENOR PRIVILEGIO. El backend recibe SOLO las variables que usa (lista explícita),
    # no todo el .env: ahí viven también la contraseña del administrador, la del
    # superusuario de Postgres y las cuentas de prueba, que el servidor no necesita y que
    # quedarían al alcance de cualquiera que logre ejecutar código dentro del contenedor.
    # Docker Compose lee backend/.env para rellenar los ${...} de este archivo.
    environment:
      # Desarrollo por defecto (cookies sin Secure, sin redirección a HTTPS). En un
      # servidor real poné NODE_ENV=production en el .env. La imagen ya arranca en producción.
      NODE_ENV: ${NODE_ENV:-development}
      # Puerto INTERNO fijo; el puerto que se abre en tu máquina es el de "ports" (abajo).
      PORT: 3000
      # Dentro de la red de docker-compose, la DB se resuelve por el nombre del servicio, no "localhost".
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@postgres-db:5432/salux_db
      DIRECT_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@postgres-db:5432/salux_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en backend/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en backend/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-}
      FORZAR_HTTPS: ${FORZAR_HTTPS:-true}
      REQUIERE_VERIFICACION_EMAIL: ${REQUIERE_VERIFICACION_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Límites anti-abuso (vacío = valor por defecto de la app)
      LOGIN_FALLOS_POR_CUENTA: ${LOGIN_FALLOS_POR_CUENTA:-}
      CORREO_ESPERA_MINUTOS: ${CORREO_ESPERA_MINUTOS:-}
      CORREOS_POR_DIA_Y_DIRECCION: ${CORREOS_POR_DIA_Y_DIRECCION:-}
      CORREOS_ABUSABLES_POR_DIA: ${CORREOS_ABUSABLES_POR_DIA:-}
      API_LIMITE_PETICIONES: ${API_LIMITE_PETICIONES:-}
    ports:
      # Solo desde esta máquina. Sin "127.0.0.1:" Docker publica en TODAS las interfaces
      # y cualquiera en tu red (Wi-Fi de la facultad, por ejemplo) alcanza la API.
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Endurecimiento del contenedor: sin privilegios nuevos, sin capacidades del kernel,
    # sistema de archivos de solo lectura (solo /tmp se puede escribir) y topes de
    # procesos y memoria para que un fallo o un abuso no consuma toda la máquina.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    # Aplica migraciones pendientes antes de levantar el servidor.
    # Se invoca el archivo real del paquete con node en vez de depender de
    # node_modules/.bin (algunos entornos Docker/Windows no generan esos
    # symlinks) ni de npx (puede intentar resolver el paquete por red).
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node src/app.js"

volumes:
  postgres_data:
