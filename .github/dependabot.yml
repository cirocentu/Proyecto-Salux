# Dependabot abre pull requests cuando una dependencia tiene una versión nueva o un
# aviso de seguridad. Cada PR pasa por el CI antes de poder mergearse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
